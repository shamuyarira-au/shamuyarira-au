<svg width="100%" viewBox="0 0 340 220" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Shamuyarira Holdings logo</title>
  <desc>Three stacked gold bars of decreasing width above the company name in spaced capitals</desc>

  <rect fill="#B89050" x="120" y="30"  width="100" height="6" rx="1"/>
  <rect fill="#B89050" x="131" y="46"  width="78"  height="6" rx="1" opacity="0.75"/>
  <rect fill="#B89050" x="142" y="62"  width="56"  height="6" rx="1" opacity="0.45"/>

  <line x1="170" y1="82" x2="170" y2="96" stroke="#B89050" stroke-width="0.8" opacity="0.5"/>

  <text font-family="Georgia, serif" font-size="18" font-weight="400" fill="#0E0D0B"
        letter-spacing="8" x="170" y="124" text-anchor="middle">SHAMUYARIRA</text>

  <line x1="70" y1="136" x2="270" y2="136" stroke="#D9D4CC" stroke-width="0.75"/>

  <text font-family="Georgia, serif" font-size="10" font-weight="400" fill="#6B6660"
        letter-spacing="6" x="170" y="158" text-anchor="middle">HOLDINGS</text>
</svg>
